name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # Replay eval against the committed cache: offline, no model, no database.
      - run: pnpm eval:summary | tee eval-report.txt
      - name: Check public/eval-summary.json is up to date
        run: |
          git diff --exit-code -- public/eval-summary.json || {
            echo "::error::public/eval-summary.json is stale. Run 'pnpm eval:summary' and commit the result."
            exit 1
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-summary
          path: |
            public/eval-summary.json
            eval-report.txt
          if-no-files-found: warn
      - run: pnpm build
